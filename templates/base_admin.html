<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title> 
    <link rel="stylesheet" href="/static/css/admin_dash_style.css">
    <link rel="icon" type="image/png" href="/static/images/logo.png">
</head>

<body>
    <div class="navbar">
        <div class="logo">
            <img src="/static/images/Logo.png" alt="Brand Logo">
            <span>Trekking Management System</span>
        </div>

        <div class="admin">
            <img src="/static/images/profile logo.png" alt="profile logo"> Welcome, Admin
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <h3>MENU</h3>
            <a class="{% if page == 'dash'%}high_side{% endif %}" href="/admin_dash">
                <img src="/static/images/dash logo.png" alt="Admin dash logo">
                <div>Dashboard</div>
            </a>
            <a class="{% if page == 'staff'%}high_side{% endif %}" href="/manage_staff">
                <img src="/static/images/Manage staff logo.png" alt="manage sattff logo">
                <div>Manage Staff</div> 
            </a>
            <a class="{% if page == 'treks'%}high_side{% endif %}" href="/manage_treks">
                
                <img src="/static/images/manage treks logo.png" alt=""><div>Manage Treks</div>
            </a>
            <a class="{% if page == 'bookings'%}high_side{% endif %}" href="/manage_bookings">
                <img src="/static/images/manage bookings logo.png" alt="manage bookings logo">
                <div>Manage Bookings</div>
            </a>
            <a class="{% if page == 'users'%}high_side{% endif %}" href="/manage_users">
                <img src="/static/images/manage users logo.png" alt="manage users logo">
                <div>Manage Users</div> 
            </a>
            <a href="/logout" class="logout">
                <img src="/static/images/logout logo.png" alt="logout logo">
                <div>Logout</div>
            </a>
        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
